[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redup-mcp-web-parser"
dynamic = ["version"]
description = "MCP Streamable HTTP service that parses web pages via Crawl4AI."
authors = [{ name = "REDUP" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
keywords = ["mcp", "crawl4ai", "web", "parser", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastmcp>=2.0,<3",
    "httpx>=0.27",
    "redup-servicekit>=1.4.3,<2",
]

[project.urls]
Homepage = "https://github.com/redup-ai/redup.mcp-web-parser/blob/master/README.md"
Repository = "https://github.com/redup-ai/redup.mcp-web-parser"
Issues = "https://github.com/redup-ai/redup.mcp-web-parser/issues"

[project.scripts]
redup-mcp-web-parser = "redup_mcp_web_parser.__main__:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/redup_mcp_web_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real Crawl4AI upstream (requires McpWebParser___upstream_base_url)",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
